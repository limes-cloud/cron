# 本地开发配置（通过 -conf conf/config.yaml 指定；生产环境走配置中心 client.NewFromEnv()）
name: cron
env: TEST

server:
  http:
    host: 0.0.0.0
    port: 7018
    timeout: 30s
    marshal:
      emitUnpopulated: true
      useProtoNames: true
    formatResponse: true
    cors: # 跨域配置（前端直连 / 网关透传时生效）
      allowCredentials: true
      allowOrigins: [ "*" ]
      allowMethods: [ "GET", "POST", "PUT", "DELETE", "OPTIONS" ]
      allowHeaders: [ "Content-Type", "Content-Length", "Authorization", "X-App-Key" ]
      exposeHeaders: [ "Content-Length", "Access-Control-Allow-Headers" ]
  grpc:
    host: 0.0.0.0
    port: 8018
    timeout: 30s

database:
  - name: cron
    enable: true # 是否启用数据库
    drive: mysql # 数据库类型
    autoCreate: false # 是否自动创建数据库
    connect:
      username: root
      password: root
      host: 127.0.0.1
      port: 3306
      dbName: cron
      option: ?charset=utf8mb4&parseTime=True&loc=Local
    config:
      transformError:
        enable: true
      maxLifetime: 2h # 最大生存时间
      maxOpenConn: 20 # 最大连接数量
      maxIdleConn: 10 # 最大空闲数量
      logLevel: 4 # 日志等级
      slowThreshold: 2s # 慢sql阈值

redis:
  - name: cache
    enable: true
    host: 127.0.0.1:6379

pool:
  size: 1000 # 最大协程数量
  expiryDuration: 10s # 过期时间
  preAlloc: true # 是否预分配
  maxBlockingTasks: 100 # 最大的并发任务
  nonblocking: false

log:
  level: 0
  caller: true
  output:
    - stdout

client:
  - server: Manager
    type: direct
    backends:
      - target: 127.0.0.1:8010
    signature:
      enable: true
      ak: manager
      sk: manager